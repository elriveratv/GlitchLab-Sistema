<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Fondo con gradiente oscuro tecnológico -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#070c1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Resplandor cian/azul para microchip -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gradiente de pulso neón -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Contenedor redondeado / squircle moderno estilo App Icon -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Borde sutil de neón cian interno -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Pistas / Pines del Microchip (Arriba, Abajo, Izquierda, Derecha) -->
  <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <!-- Top pins -->
    <line x1="48" y1="23" x2="48" y2="31"/>
    <line x1="64" y1="23" x2="64" y2="31"/>
    <line x1="80" y1="23" x2="80" y2="31"/>
    <!-- Bottom pins -->
    <line x1="48" y1="97" x2="48" y2="105"/>
    <line x1="64" y1="97" x2="64" y2="105"/>
    <line x1="80" y1="97" x2="80" y2="105"/>
    <!-- Left pins -->
    <line x1="23" y1="48" x2="31" y2="48"/>
    <line x1="23" y1="64" x2="31" y2="64"/>
    <line x1="23" y1="80" x2="31" y2="80"/>
    <!-- Right pins -->
    <line x1="97" y1="48" x2="105" y2="48"/>
    <line x1="97" y1="64" x2="105" y2="64"/>
    <line x1="97" y1="80" x2="105" y2="80"/>
  </g>

  <!-- Cuerpo Central del Microchip con relieve tecnológico -->
  <rect x="31" y="31" width="66" height="66" rx="14" fill="#091426" stroke="#0284c7" stroke-width="2.5"/>
  <rect x="38" y="38" width="52" height="52" rx="10" fill="#0c1d38" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Marca de orientación del chip (muesca redonda esquina superior izquierda) -->
  <circle cx="46" cy="46" r="3" fill="#38bdf8" opacity="0.9"/>

  <!-- Pulso / Onda ECG GlitchLab Neón en el centro del Microchip con Glow -->
  <path d="M 40,64 L 52,64 L 57,69 L 64,45 L 72,83 L 78,57 L 83,64 L 88,64" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Chispas / Nodos de soldadura de microelectrónica en los picos -->
  <circle cx="64" cy="45" r="2.5" fill="#ffffff"/>
  <circle cx="72" cy="83" r="2.5" fill="#00ffff"/>
</svg>
